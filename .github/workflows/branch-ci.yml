name: Branch CI

on:
  workflow_dispatch:

jobs:
  build:
    name: Build AAPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE }}" | base64 -d > app/release.jks

      - name: Build Full Release
        run: ./gradlew :app:assembleFullRelease --no-daemon
        env:
          GRADLE_OPTS: "-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          RELEASE_STORE_FILE: release.jks
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Sign APK with apksigner (V2/V3)
        run: |
          BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
          APK_FILE=$(ls app/build/outputs/apk/full/release/*.apk | head -n 1)
          $BUILD_TOOLS_DIR/apksigner sign --ks app/release.jks --ks-pass pass:${{ secrets.RELEASE_STORE_PASSWORD }} --key-pass pass:${{ secrets.RELEASE_KEY_PASSWORD }} --ks-key-alias ${{ secrets.RELEASE_KEY_ALIAS }} --out app/build/outputs/apk/full/release/app-full-release-signed.apk $APK_FILE

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AAPS-Release-APK
          path: app/build/outputs/apk/full/release/app-full-release-signed.apk
